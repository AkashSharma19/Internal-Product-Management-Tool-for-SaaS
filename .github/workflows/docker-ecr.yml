name: Build and Push Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: docker-ecr-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ap-south-1
  AWS_ACCOUNT_ID: '770014814665'
  ECR_REPOSITORY: akash_ipmt
  ECS_CLUSTER: akash_ipmt
  ECS_SERVICE: akash_ipmt-service
  IMAGE_TAG: latest
  AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}

jobs:
  validate:
    name: Validate application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend and server
        run: npm run build && npm run build:server

  docker:
    name: Build and push image
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC role
        if: ${{ env.AWS_ROLE_TO_ASSUME != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}

      - name: Configure AWS credentials using access keys
        if: ${{ env.AWS_ROLE_TO_ASSUME == '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Verify ECR repository
        run: |
          aws ecr describe-repositories \
            --region "$AWS_REGION" \
            --repository-names "$ECR_REPOSITORY" \
            --query 'repositories[0].repositoryUri' \
            --output text

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        id: docker-build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image digest
        run: |
          echo "Pushed ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}"
          echo "Digest ${{ steps.docker-build.outputs.digest }}"

      - name: Register ECS task definition with Sync V2 configuration
        env:
          PRODUCTSHIP_WEBHOOK_SECRET: ${{ secrets.PRODUCTSHIP_WEBHOOK_SECRET }}
          COACHLMS_WEBHOOK_SECRET: ${{ secrets.COACHLMS_WEBHOOK_SECRET }}
        run: |
          if [ -z "$PRODUCTSHIP_WEBHOOK_SECRET" ] || [ -z "$COACHLMS_WEBHOOK_SECRET" ]; then
            echo "Required Sync V2 secrets are not configured."
            exit 1
          fi

          TASK_DEFINITION_ARN=$(aws ecs describe-services \
            --region "$AWS_REGION" \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query 'services[0].taskDefinition' \
            --output text)

          aws ecs describe-task-definition \
            --region "$AWS_REGION" \
            --task-definition "$TASK_DEFINITION_ARN" \
            --query 'taskDefinition' \
            --output json > current-task-definition.json

          CONTAINER_NAME=$(jq -r --arg repository "$ECR_REPOSITORY" \
            '.containerDefinitions[] | select(.image | contains($repository)) | .name' \
            current-task-definition.json | head -n 1)

          if [ -z "$CONTAINER_NAME" ]; then
            echo "Could not identify the application container."
            exit 1
          fi

          jq \
            --arg container "$CONTAINER_NAME" \
            --arg inboundSecret "$PRODUCTSHIP_WEBHOOK_SECRET" \
            --arg outboundSecret "$COACHLMS_WEBHOOK_SECRET" \
            --arg timeout "10000" \
            'del(
              .taskDefinitionArn,
              .revision,
              .status,
              .requiresAttributes,
              .compatibilities,
              .registeredAt,
              .registeredBy,
              .deregisteredAt
            )
            | .containerDefinitions |= map(
                if .name == $container then
                  .environment = (
                    (.environment // [])
                    | map(select(.name != "PRODUCTSHIP_WEBHOOK_SECRET" and .name != "COACHLMS_WEBHOOK_SECRET" and .name != "COACHLMS_WEBHOOK_TIMEOUT_MS"))
                    + [
                        {"name":"PRODUCTSHIP_WEBHOOK_SECRET","value":$inboundSecret},
                        {"name":"COACHLMS_WEBHOOK_SECRET","value":$outboundSecret},
                        {"name":"COACHLMS_WEBHOOK_TIMEOUT_MS","value":$timeout}
                      ]
                  )
                else . end
              )' current-task-definition.json > updated-task-definition.json

          REGISTERED_TASK_DEFINITION=$(aws ecs register-task-definition \
            --region "$AWS_REGION" \
            --cli-input-json file://updated-task-definition.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "REGISTERED_TASK_DEFINITION=$REGISTERED_TASK_DEFINITION" >> "$GITHUB_ENV"
          echo "Registered a new ECS task-definition revision for Sync V2."

      - name: Deploy new ECS task definition
        run: |
          aws ecs update-service \
            --region "$AWS_REGION" \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "$REGISTERED_TASK_DEFINITION" \
            --force-new-deployment \
            --query 'service.deployments[?status==`PRIMARY`].[id,status,rolloutState]' \
            --output table

      - name: Wait for ECS service stability
        run: |
          aws ecs wait services-stable \
            --region "$AWS_REGION" \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE"
